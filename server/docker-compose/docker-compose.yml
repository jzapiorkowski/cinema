version: "3.8"

services:
  api:
    build:
      context: ..
      dockerfile: Cinema.API/Dockerfile
    image: cinema-api:latest
    container_name: cinema-api
    environment:
      ConnectionStrings__DatabaseConnectionString: "Host=db;Port=5432;Database=dev-db;Username=dev-user;Password=dev-password"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8080:8080"
    depends_on:
      - db
      - migrations
  db:
    image: postgres:15-alpine
    container_name: cinema-db
    environment:
      POSTGRES_USER: dev-user
      POSTGRES_PASSWORD: dev-password
      POSTGRES_DB: dev-db
    ports:
      - "5432:5432"
  migrations:
    build:
      context: ..
      dockerfile: docker-compose/migrations.Dockerfile
    image: cinema-migrations:latest
    container_name: cinema-migrations-runner
    environment:
      ConnectionStrings__DatabaseConnectionString: "Host=db;Port=5432;Database=dev-db;Username=dev-user;Password=dev-password"
    depends_on:
      - db
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: cinema-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db/dev-db
      KC_DB_USERNAME: dev-user
      KC_DB_PASSWORD: dev-password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - db
